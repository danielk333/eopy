[build-system]
requires = ["scikit-build-core>=0.10", "setuptools>=68"]
build-backend = "scikit_build_core.build"

[project]
name = "eopy"
version = "0.1.0"
description = "Fast Python Earth orbit propagation kernels with NumPy/SciPy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "pyorb>=0.6.3",
    "pymsis>=0.12",
    "scipy>=1.11",
    "spacecoords>=0.2.2",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8"]

[tool.scikit-build]
wheel.packages = ["eopy"]
cmake.version = ">=3.18"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
